{% extends "base.html" %}
{% load static %}

{% block title %}Change Password{% endblock %}

{% block content %}

    <!-- forgot password -->
    <div class="login-area py-100">
        <div class="container">
            <div class="col-md-5 mx-auto">
                <div class="login-form">
                    <div class="login-header text-center">
                        <img src="{% static 'img/logo/logo.png' %}" alt="Logo">
                        <p>Change your Password</p>
                    </div>

                    <!-- Error Alert -->
                    <div id="error_alert" class="alert alert-danger alert-dismissible d-none" role="alert">
                        <strong id="error_message"></strong>
                    </div>

                    <div class="form-group">
                        <form id="changePasswordForm" method="POST">
                            {% csrf_token %}
                            <div class="form-group">
                                <label class="small mb-1" for="old_password">Old Password</label>
                                <input type="password" name="old_password" autocomplete="old-password"
                                       class="form-control" required id="id_old_password"
                                       placeholder="Enter Old Password"/>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1" for="id_new_password1">New Password</label>
                                <input type="password" name="new_password1" autocomplete="new-password"
                                       required id="id_new_password1" class="form-control"
                                       placeholder="Enter New Password"/>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1" for="id_new_password2">New Password Confirmation</label>
                                <input type="password" name="new_password2" autocomplete="new-password"
                                       required id="id_new_password2" class="form-control"
                                       placeholder="Confirm New Password"/>
                            </div>
                            <div class="d-flex align-items-center">
                                <button type="submit" class="theme-btn"><i class="far fa-key"></i> Change Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- forgot password end -->

{% endblock %}
{% block extra_js %}
    <script>
        $(document).ready(function () {
            $("#changePasswordForm").submit(function (event) {
                event.preventDefault();

                let oldPassword = $("#id_old_password").val().trim();
                let newPassword1 = $("#id_new_password1").val().trim();
                let newPassword2 = $("#id_new_password2").val().trim();

                if (newPassword1 !== newPassword2) {
                    Swal.fire({
                        icon: "error",
                        title: "Error",
                        text: "New passwords do not match!"
                    });
                    return;
                }

                let csrfToken = $("input[name=csrfmiddlewaretoken]").val();
                let requestData = JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword1
                });

                console.log("Sending Data:", requestData); // Debugging: Check if data is correct

                $.ajax({
                    url: "{% url 'change-password' %}",
                    method: "POST",
                    headers: {"X-CSRFToken": csrfToken},
                    contentType: "application/json",
                    data: requestData,
                    success: function (response) {
                        Swal.fire({
                            icon: "success",
                            title: "Password Changed Successfully",
                            text: "You can now log in with your new password.",
                            confirmButtonColor: "#3085d6",
                        }).then(() => {
                            window.location.href = "{% url 'login' %}";
                        });
                    },
                    error: function (xhr) {
                        let errorMessage = xhr.responseJSON?.error || "An error occurred. Please try again.";
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: errorMessage
                        });
                    }
                });
            });
        });
    </script>
{% endblock %}
