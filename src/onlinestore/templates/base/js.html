<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script>
    const updateItemUrl = '{% url "cart:update_item" %}';
    const addressApiUrl = "{% url 'shop:get_address_data' %}";
    var csrf = "{{ csrf_token }}";
    const phNumbers = "{{ ph_number_prefixes|safe }}"
    const getProductQuantityUrl = "{% url 'cart:fetch_product_quantity' %}";
    
    function fetchProductQuantity(productSlug) {
        console.log(`Fetching available quantity for product: ${productSlug}`);
        return $.ajax({
            url: getProductQuantityUrl, 
            method: 'GET',
            data: {slug: productSlug},
            dataType: 'json'
        }).fail(function (xhr, status, error) {
            console.error(`Failed to fetch quantity for product: ${productSlug}`, error);
        });
    }
</script>
